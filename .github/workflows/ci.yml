name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate frontend JavaScript
        run: node --check app/static/app.js
      - name: Run lint checks
        run: ruff check .
      - name: Run tests
        run: pytest
      - name: Build production container
        run: docker build --tag financial-advisor:ci .
      - name: Smoke-test production container
        run: |
          docker run --detach --name financial-advisor-ci --publish 8080:8080 financial-advisor:ci
          trap 'docker rm --force financial-advisor-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/app >/dev/null
          curl --fail --silent http://127.0.0.1:8080/assets/app.js >/dev/null
